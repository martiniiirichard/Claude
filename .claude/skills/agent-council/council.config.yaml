council:
  chairman:
    role: "auto"  # "auto" = current host agent (claude or codex)
  members:
    - name: claude
      command: "claude -p"
      emoji: "🧠"
      color: "CYAN"
    - name: gemini
      command: "cmd /c gemini --skip-trust -p"
      emoji: "💎"
      color: "GREEN"
    - name: codex
      command: "cmd /c codex exec"
      emoji: "🤖"
      color: "BLUE"
  settings:
    exclude_chairman_from_members: true
    timeout: 120  # seconds per member
